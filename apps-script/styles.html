<style>
/* ===========================================
   SkyBlueEarthJapan 経費管理アプリ - スタイル
   =========================================== */

:root {
  --color-primary: #2196F3;
  --color-primary-dark: #1976D2;
  --color-primary-light: #BBDEFB;
  --color-secondary: #FFF9C4;
  --color-background: #FAFAFA;
  --color-surface: #FFFFFF;
  --color-error: #E57373;
  --color-success: #81C784;
  --color-revenue: #4CAF50;
  --color-expense: #EF5350;
  --color-profit: #2196F3;
  --text-primary: #212121;
  --text-secondary: #757575;
  --text-hint: #9E9E9E;
  --text-white: #FFFFFF;
  --border-color: #E0E0E0;
  --border-radius: 8px;
  --border-radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.1);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.12);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.15);
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-md: 16px;
  --font-size-lg: 18px;
  --font-size-xl: 24px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  font-family: var(--font-family);
  font-size: var(--font-size-md);
  color: var(--text-primary);
  background-color: var(--color-background);
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: var(--text-white);
  padding: var(--spacing-md);
  box-shadow: var(--shadow-md);
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 600px;
  margin: 0 auto;
}

.header-title { font-size: var(--font-size-lg); font-weight: 600; }

.ai-toggle {
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
  cursor: pointer;
  font-size: var(--font-size-sm);
}

.ai-toggle input { display: none; }
.toggle-label { opacity: 0.9; }

/* Main */
.main-content {
  flex: 1;
  padding: var(--spacing-md);
  padding-bottom: 100px;
  max-width: 600px;
  margin: 0 auto;
  width: 100%;
}

.page { display: none; }
.page.active { display: block; }

.page-header { margin-bottom: var(--spacing-lg); }
.page-header h2 { font-size: var(--font-size-xl); font-weight: 600; margin-bottom: var(--spacing-xs); }
.page-subtitle { color: var(--text-secondary); font-size: var(--font-size-sm); }

.section { margin-bottom: var(--spacing-lg); }

/* Voice Input */
.voice-input-area { text-align: center; padding: var(--spacing-lg); }

.voice-btn {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: var(--text-white);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-sm);
  margin: 0 auto var(--spacing-md);
  box-shadow: var(--shadow-lg);
  transition: transform 0.2s, box-shadow 0.2s;
}

.voice-btn:hover { transform: scale(1.05); }
.voice-btn:active { transform: scale(0.95); }

.voice-btn.recording {
  background: linear-gradient(135deg, var(--color-error) 0%, #C62828 100%);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 83, 80, 0.5); }
  50% { box-shadow: 0 0 0 20px rgba(239, 83, 80, 0); }
}

.voice-icon { font-size: 36px; }
.voice-label { font-size: var(--font-size-sm); font-weight: 500; }
.voice-hint { color: var(--text-hint); font-size: var(--font-size-xs); line-height: 1.6; }

.voice-text-area { margin-top: var(--spacing-md); }
.voice-text-area textarea {
  width: 100%;
  padding: var(--spacing-md);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  font-size: var(--font-size-md);
  resize: none;
  margin-bottom: var(--spacing-sm);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-sm) var(--spacing-md);
  border-radius: var(--border-radius);
  font-size: var(--font-size-md);
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  min-height: 44px;
}

.btn-primary { background-color: var(--color-primary); color: var(--text-white); }
.btn-primary:hover { background-color: var(--color-primary-dark); }
.btn-secondary { background-color: var(--color-surface); color: var(--color-primary); border: 1px solid var(--color-primary); }
.btn-secondary:hover { background-color: var(--color-primary-light); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background-color: rgba(0,0,0,0.05); }
.btn-danger { background-color: var(--color-error); color: var(--text-white); }
.btn-block { width: 100%; }
.btn-lg { padding: var(--spacing-md) var(--spacing-lg); font-size: var(--font-size-lg); }

/* Cards */
.ai-result-card, .confirm-card, .summary-card, .analytics-card, .subscription-card {
  background: var(--color-surface);
  border-radius: var(--border-radius-lg);
  padding: var(--spacing-lg);
  box-shadow: var(--shadow-md);
}

.card-title { font-size: var(--font-size-lg); font-weight: 600; margin-bottom: var(--spacing-sm); }
.card-subtitle { color: var(--text-secondary); font-size: var(--font-size-sm); margin-bottom: var(--spacing-md); }

.ai-result-content { margin-bottom: var(--spacing-md); }
.ai-result-item { display: flex; justify-content: space-between; padding: var(--spacing-sm) 0; border-bottom: 1px solid var(--border-color); }
.ai-result-item:last-child { border-bottom: none; }
.ai-result-label { color: var(--text-secondary); }
.ai-result-value { font-weight: 500; }
.ai-result-actions { display: flex; gap: var(--spacing-sm); flex-wrap: wrap; }

.ai-questions { background: var(--color-secondary); padding: var(--spacing-md); border-radius: var(--border-radius); margin-bottom: var(--spacing-md); }
.ai-question-text { font-weight: 500; margin-bottom: var(--spacing-sm); }

/* Form */
.form-header { display: flex; align-items: center; gap: var(--spacing-md); margin-bottom: var(--spacing-md); }
.form-header h3 { flex: 1; }
.transaction-form { margin-top: var(--spacing-md); }
.form-group { margin-bottom: var(--spacing-md); }
.form-label { display: block; font-size: var(--font-size-sm); font-weight: 500; margin-bottom: var(--spacing-xs); color: var(--text-secondary); }
.required { color: var(--color-error); }

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: var(--spacing-sm) var(--spacing-md);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  font-size: var(--font-size-md);
  background: var(--color-surface);
  min-height: 44px;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 2px var(--color-primary-light);
}

.input-with-prefix { display: flex; align-items: center; }
.input-prefix { padding: var(--spacing-sm) var(--spacing-md); background: var(--color-background); border: 1px solid var(--border-color); border-right: none; border-radius: var(--border-radius) 0 0 var(--border-radius); color: var(--text-secondary); min-height: 44px; display: flex; align-items: center; }
.input-with-prefix .form-input { border-radius: 0 var(--border-radius) var(--border-radius) 0; }

.segment-control { display: flex; background: var(--color-background); border-radius: var(--border-radius); padding: 2px; }
.segment-control input { display: none; }
.segment-control label { flex: 1; text-align: center; padding: var(--spacing-sm); cursor: pointer; border-radius: var(--border-radius); transition: all 0.2s; font-size: var(--font-size-sm); min-height: 40px; display: flex; align-items: center; justify-content: center; }
.segment-control input:checked + label { background: var(--color-primary); color: var(--text-white); }
.segment-4 label { font-size: var(--font-size-xs); }

.form-actions { display: flex; flex-direction: column; gap: var(--spacing-sm); margin-top: var(--spacing-lg); }

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: var(--color-surface);
  border-top: 1px solid var(--border-color);
  padding: var(--spacing-sm) 0;
  padding-bottom: max(var(--spacing-sm), env(safe-area-inset-bottom));
  z-index: 100;
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--spacing-xs);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-secondary);
  transition: color 0.2s;
  min-height: 50px;
}

.tab-item.active { color: var(--color-primary); }
.tab-icon { font-size: 20px; }
.tab-label { font-size: var(--font-size-xs); }

/* History */
.month-selector { display: flex; align-items: center; justify-content: center; gap: var(--spacing-md); margin-bottom: var(--spacing-md); }
.month-nav { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--color-surface); cursor: pointer; font-size: var(--font-size-lg); display: flex; align-items: center; justify-content: center; }
.month-display { font-size: var(--font-size-lg); font-weight: 600; min-width: 120px; text-align: center; }

.summary-card { display: flex; justify-content: space-around; margin-bottom: var(--spacing-md); padding: var(--spacing-md); }
.summary-item { text-align: center; }
.summary-label { display: block; font-size: var(--font-size-xs); color: var(--text-secondary); margin-bottom: 2px; }
.summary-value { font-size: var(--font-size-lg); font-weight: 600; }
.summary-value.revenue { color: var(--color-revenue); }
.summary-value.expense { color: var(--color-expense); }
.summary-value.profit { color: var(--color-profit); }

.filter-bar { display: flex; gap: var(--spacing-sm); margin-bottom: var(--spacing-md); }
.filter-select, .filter-input { flex: 1; padding: var(--spacing-sm); border: 1px solid var(--border-color); border-radius: var(--border-radius); font-size: var(--font-size-sm); background: var(--color-surface); min-height: 40px; }

.transaction-list { display: flex; flex-direction: column; gap: var(--spacing-sm); }

.transaction-card { background: var(--color-surface); border-radius: var(--border-radius); padding: var(--spacing-md); box-shadow: var(--shadow-sm); }
.transaction-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xs); }
.transaction-date { font-size: var(--font-size-sm); color: var(--text-secondary); }
.transaction-type { font-size: var(--font-size-xs); padding: 2px 8px; border-radius: 4px; font-weight: 500; }
.transaction-type.expense { background: #FFEBEE; color: var(--color-expense); }
.transaction-type.revenue { background: #E8F5E9; color: var(--color-revenue); }
.transaction-vendor { font-weight: 500; margin-bottom: 2px; }
.transaction-description { font-size: var(--font-size-sm); color: var(--text-secondary); }
.transaction-footer { display: flex; justify-content: space-between; align-items: center; margin-top: var(--spacing-sm); }
.transaction-category { font-size: var(--font-size-sm); color: var(--text-secondary); }
.transaction-amount { font-size: var(--font-size-lg); font-weight: 600; }
.transaction-amount.expense { color: var(--color-expense); }
.transaction-amount.revenue { color: var(--color-revenue); }
.transaction-actions { display: flex; gap: var(--spacing-xs); margin-top: var(--spacing-sm); padding-top: var(--spacing-sm); border-top: 1px solid var(--border-color); }
.transaction-actions .btn { flex: 1; padding: var(--spacing-xs); font-size: var(--font-size-xs); min-height: 36px; }

/* Subscription */
.subscription-list { display: flex; flex-direction: column; gap: var(--spacing-sm); }
.subscription-card { background: var(--color-surface); border-radius: var(--border-radius); padding: var(--spacing-md); box-shadow: var(--shadow-sm); }
.subscription-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xs); }
.subscription-title { font-weight: 600; }
.subscription-amount { font-size: var(--font-size-lg); font-weight: 600; color: var(--color-expense); }
.subscription-details { font-size: var(--font-size-sm); color: var(--text-secondary); }
.subscription-actions { display: flex; gap: var(--spacing-xs); margin-top: var(--spacing-sm); }
.subscription-actions .btn { flex: 1; min-height: 36px; }

.subscription-summary { flex-direction: column; gap: var(--spacing-md); }

.fab {
  position: fixed;
  bottom: 90px;
  right: var(--spacing-md);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--color-primary);
  color: var(--text-white);
  border: none;
  font-size: 28px;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  z-index: 50;
}

/* Analytics */
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-md); margin-bottom: var(--spacing-sm); }
.kpi-item { text-align: center; }
.kpi-label { display: block; font-size: var(--font-size-sm); color: var(--text-secondary); margin-bottom: 4px; }
.kpi-value { font-size: var(--font-size-xl); font-weight: 600; }
.kpi-profit .kpi-value { color: var(--color-profit); }

.chart-container { min-height: 150px; margin: var(--spacing-md) 0; }
.chart-legend { display: flex; flex-wrap: wrap; gap: var(--spacing-sm); font-size: var(--font-size-sm); }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-color { width: 12px; height: 12px; border-radius: 2px; }

.tax-card { background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%); }
.tax-info { margin-bottom: var(--spacing-md); }
.tax-item { display: flex; justify-content: space-between; padding: var(--spacing-sm) 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
.tax-item:last-child { border-bottom: none; }
.tax-label { color: var(--text-secondary); }
.tax-value { font-weight: 600; }
.tax-warning { display: flex; gap: var(--spacing-sm); padding: var(--spacing-md); background: rgba(255,255,255,0.7); border-radius: var(--border-radius); }
.warning-icon { color: #FBC02D; }
.tax-warning p { font-size: var(--font-size-sm); color: var(--text-secondary); line-height: 1.5; }

/* Modal */
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: var(--spacing-md); }
.modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); }
.modal-content { position: relative; background: var(--color-surface); border-radius: var(--border-radius-lg); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
.modal-small { max-width: 350px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-md); border-bottom: 1px solid var(--border-color); }
.modal-header h3 { font-size: var(--font-size-lg); }
.modal-close { width: 32px; height: 32px; border: none; background: none; font-size: 24px; cursor: pointer; color: var(--text-secondary); }
.modal-body { padding: var(--spacing-md); }
.modal-subtitle { color: var(--text-secondary); font-size: var(--font-size-sm); margin-bottom: var(--spacing-md); }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--spacing-sm); padding: var(--spacing-md); border-top: 1px solid var(--border-color); }

/* Toast */
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--text-primary); color: var(--text-white); padding: var(--spacing-md) var(--spacing-lg); border-radius: var(--border-radius); z-index: 300; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Loading */
.loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 400; }
.loading-spinner { width: 40px; height: 40px; border: 3px solid var(--color-primary-light); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: var(--spacing-md); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Utility */
.hidden { display: none !important; }
.note-text { font-size: var(--font-size-xs); color: var(--text-hint); }
.hint-text { font-size: var(--font-size-xs); color: var(--text-hint); text-align: center; margin-top: var(--spacing-xs); }
.suggestion-text { font-size: var(--font-size-xs); color: var(--color-primary); margin-top: 4px; }
.manual-input-link { text-align: center; padding: var(--spacing-md); border-top: 1px solid var(--border-color); }
.empty-state { text-align: center; padding: var(--spacing-xl); color: var(--text-secondary); }
</style>
